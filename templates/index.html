<!DOCTYPE html>
<html>
<head>
<title>Brain Tumor Detection</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    text-align:center;
    margin-top:50px;
}

.container{
    background:white;
    padding:30px;
    width:450px;
    margin:auto;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

button{
    padding:10px 20px;
    background:#007bff;
    border:none;
    color:white;
    font-size:16px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

img{
    margin-top:20px;
    max-width:300px;
    border-radius:8px;
}

.result{
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
    color:#2e7d32;
}

.confidence{
    font-size:16px;
    color:#555;
    margin-top:5px;
}
</style>

</head>

<body>

<div class="container">

<h2>Brain Tumor Detection</h2>

<form method="POST" enctype="multipart/form-data">
<input type="file" name="file" required>
<br><br>
<button type="submit">Predict</button>
</form>

{% if result %}
<div class="result">
Prediction: {{ result }}
</div>

{% if confidence %}
<div class="confidence">
Confidence: {{ confidence }}%
</div>
{% endif %}
{% endif %}

{% if filename %}
<img src="{{ url_for('static', filename=filename) }}">
{% endif %}

</div>

</body>
</html>
