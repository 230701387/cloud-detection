name: Full CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:

  build-backend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Simulate Docker Build
      run: echo "Docker image built"

    - name: Simulate Deploy to Azure
      run: echo "Backend deployed"

---

  build-frontend:
    runs-on: ubuntu-latest
    needs: build-backend

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Simulate Frontend Build
      run: echo "Frontend built"

    - name: Simulate Frontend Deploy
      run: echo "Frontend deployed"
